<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-label="Cyvantas AI Agent">
  <title>Cyvantas AI Agent — Autonomous, Evidence-Driven Security Testing</title>
  <defs>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#63e6ff"/>
      <stop offset="0.5" stop-color="#00d9ff"/>
      <stop offset="1" stop-color="#149cff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1424"/>
      <stop offset="1" stop-color="#050a12"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1536" height="1024" fill="#02050a"/>
  <path d="M0 770H1536" stroke="#103c59" stroke-width="2"/>
  <g opacity="0.25" stroke="#0b3650" stroke-width="1">
    <path d="M0 820H1536M0 900H1536M0 980H1536"/>
    <path d="M150 780L90 1024M420 780L385 1024M768 780V1024M1116 780L1150 1024M1385 780L1445 1024"/>
  </g>

  <!-- CYVANTAS dragon mark -->
  <g transform="translate(72 56) scale(0.95)" fill="none" stroke="url(#cyan)" stroke-width="12" filter="url(#glow)">
    <path d="M98 278C30 247 10 174 36 112C61 54 111 24 176 20C156 42 149 62 153 82C198 79 234 95 258 124C229 118 204 123 185 139C214 143 232 157 243 178C207 160 173 161 143 175C117 188 94 214 98 278Z"/>
    <path d="M89 278C126 253 140 215 143 175"/>
    <circle cx="177" cy="81" r="4" fill="#63e6ff"/>
    <path d="M33 145H4M57 77L31 52M81 38L68 10"/>
  </g>

  <text x="430" y="150" fill="#f4f7fb" font-family="Arial, Helvetica, sans-serif" font-size="100" font-weight="900" letter-spacing="8">CY</text>
  <text x="602" y="150" fill="url(#cyan)" font-family="Arial, Helvetica, sans-serif" font-size="100" font-weight="900" letter-spacing="8">VANTAS</text>
  <text x="770" y="230" fill="#f4f7fb" font-family="Arial, Helvetica, sans-serif" font-size="54" letter-spacing="18" text-anchor="middle">AI AGENT</text>
  <text x="770" y="286" fill="#7ddfff" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="7" text-anchor="middle">AUTONOMOUS  ·  EVIDENCE-DRIVEN  ·  SECURITY TESTING</text>

  <text x="770" y="340" fill="#12d9ff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="middle">Your AI-Powered Offensive Security Companion</text>

  <!-- left feature rail -->
  <g font-family="Arial, Helvetica, sans-serif">
    <g fill="none" stroke="url(#cyan)" stroke-width="6">
      <circle cx="92" cy="390" r="28"/><circle cx="92" cy="500" r="28"/><circle cx="92" cy="610" r="28"/><circle cx="92" cy="720" r="28"/>
    </g>
    <g fill="#d7f7ff">
      <text x="140" y="385" font-size="25" font-weight="800">AI-POWERED</text>
      <text x="140" y="418" font-size="20">Planning, reasoning and execution</text>
      <text x="140" y="495" font-size="25" font-weight="800">FULL LIFECYCLE</text>
      <text x="140" y="528" font-size="20">Recon → Exploit → Post-Exploitation → Reporting</text>
      <text x="140" y="605" font-size="25" font-weight="800">EVIDENCE-DRIVEN</text>
      <text x="140" y="638" font-size="20">Clear, reproducible security results</text>
      <text x="140" y="715" font-size="25" font-weight="800">MODULAR &amp; EXTENSIBLE</text>
      <text x="140" y="748" font-size="20">Add tools, agents, skills and workflows</text>
    </g>
  </g>

  <!-- central operator / workstation -->
  <rect x="500" y="370" width="720" height="360" rx="24" fill="url(#panel)" stroke="#0e5d88" stroke-width="3"/>
  <rect x="535" y="402" width="330" height="240" rx="14" fill="#02070d" stroke="#164f6e" stroke-width="2"/>
  <text x="565" y="442" fill="#54dfff" font-family="monospace" font-size="20">[*] Reconnaissance...</text>
  <text x="565" y="476" fill="#54dfff" font-family="monospace" font-size="20">[*] Scanning targets...</text>
  <text x="565" y="510" fill="#54dfff" font-family="monospace" font-size="20">[*] Analyzing vulnerabilities...</text>
  <text x="565" y="544" fill="#54dfff" font-family="monospace" font-size="20">[*] Exploitation testing...</text>
  <text x="565" y="578" fill="#54dfff" font-family="monospace" font-size="20">[*] Gathering evidence...</text>
  <text x="565" y="612" fill="#54dfff" font-family="monospace" font-size="20">$ _</text>

  <!-- hooded AI figure -->
  <path d="M1000 686C970 650 960 570 980 507C998 450 1034 419 1080 414C1126 419 1162 450 1180 507C1200 570 1190 650 1160 686Z" fill="#07111e" stroke="#0b7fb1" stroke-width="4"/>
  <path d="M1033 486C1048 454 1074 438 1080 438C1086 438 1112 454 1127 486L1104 540H1056Z" fill="#02060b"/>
  <path d="M1050 490L1074 481L1062 503L1041 500Z" fill="#3ce7ff" filter="url(#glow)"/>
  <path d="M1110 490L1086 481L1098 503L1119 500Z" fill="#3ce7ff" filter="url(#glow)"/>

  <!-- laptop -->
  <rect x="890" y="605" width="390" height="128" rx="10" fill="#03080e" stroke="#117aa6" stroke-width="4"/>
  <text x="1085" y="657" fill="#f4f7fb" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="800" text-anchor="middle">CYVANTAS</text>
  <text x="1085" y="694" fill="#8edfff" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="7" text-anchor="middle">AI AGENT</text>

  <!-- right insight panel -->
  <rect x="1250" y="370" width="220" height="360" rx="20" fill="url(#panel)" stroke="#0e5d88" stroke-width="3"/>
  <text x="1280" y="418" fill="#67e3ff" font-family="monospace" font-size="18">AUTOMATE</text>
  <text x="1280" y="452" fill="#67e3ff" font-family="monospace" font-size="18">ASSESS</text>
  <text x="1280" y="486" fill="#67e3ff" font-family="monospace" font-size="18">ANALYZE</text>
  <text x="1280" y="520" fill="#67e3ff" font-family="monospace" font-size="18">SECURE</text>
  <path d="M1280 552H1350" stroke="#12d9ff" stroke-width="7"/>
  <text x="1280" y="610" fill="#b9eaff" font-family="Arial, Helvetica, sans-serif" font-size="17">REAL TARGETS</text>
  <text x="1280" y="640" fill="#b9eaff" font-family="Arial, Helvetica, sans-serif" font-size="17">REAL INSIGHTS</text>
  <text x="1280" y="670" fill="#b9eaff" font-family="Arial, Helvetica, sans-serif" font-size="17">REAL SECURITY</text>
  <text x="1280" y="700" fill="#b9eaff" font-family="Arial, Helvetica, sans-serif" font-size="17">A SAFER TOMORROW</text>

  <!-- workflow footer -->
  <g transform="translate(42 812)">
    <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
      <circle cx="100" cy="50" r="38" fill="#07131e" stroke="#21d9ff" stroke-width="4"/>
      <circle cx="365" cy="50" r="38" fill="#07131e" stroke="#21d9ff" stroke-width="4"/>
      <circle cx="630" cy="50" r="38" fill="#07131e" stroke="#21d9ff" stroke-width="4"/>
      <circle cx="895" cy="50" r="38" fill="#07131e" stroke="#21d9ff" stroke-width="4"/>
      <circle cx="1160" cy="50" r="38" fill="#07131e" stroke="#21d9ff" stroke-width="4"/>
      <circle cx="1425" cy="50" r="38" fill="#07131e" stroke="#21d9ff" stroke-width="4"/>
      <g fill="#d7f7ff" font-size="18">
        <text x="100" y="116">RECONNAISSANCE</text>
        <text x="365" y="116">VULNERABILITY ANALYSIS</text>
        <text x="630" y="116">EXPLOITATION TESTING</text>
        <text x="895" y="116">REPORT GENERATION</text>
        <text x="1160" y="116">MULTI-AGENT WORKFLOW</text>
        <text x="1425" y="116">CUSTOM TOOLS &amp; INTEGRATIONS</text>
      </g>
    </g>
  </g>

  <text x="768" y="1000" fill="#58cfea" font-family="monospace" font-size="17" letter-spacing="6" text-anchor="middle">OPEN SOURCE  ·  ETHICAL  ·  BUILT FOR A MORE SECURE WORLD</text>
</svg>
